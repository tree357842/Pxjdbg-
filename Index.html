<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Chat UI</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --user: #2563eb;
      --bot: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: var(--panel);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    header {
      padding: 16px;
      font-weight: 600;
      border-bottom: 1px solid #1f2937;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .message.user {
      background: var(--user);
      align-self: flex-end;
    }

    .message.bot {
      background: var(--bot);
      align-self: flex-start;
    }

    footer {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #1f2937;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>Chat <span style="font-size:12px;color:#9ca3af">(Configurable API)</span></header>
    <div id="messages" class="messages"></div>
    <details style="padding:12px;border-top:1px solid #1f2937">
      <summary style="cursor:pointer;font-size:14px">API Settings</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <input id="baseUrl" placeholder="Base URL (https://example.com)" />
        <input id="apiPath" placeholder="API Path (/chat)" />
        <input id="apiKey" placeholder="API Key (optional)" />
      </div>
    </details>
    <div class="hint">Configure <code>API_URL</code> in the script section</div>
    <footer>
      <input id="input" placeholder="Type a message..." />
      <button id="send">Send</button>
    </footer>
  </div>

  <script>
    // ==============================
    // CONFIGURATION
    // ==============================
    // ==============================
    // CONFIGURATION (editable in UI)
    // ==============================
    let baseUrl = localStorage.getItem("baseUrl") || "";
    let apiPath = localStorage.getItem("apiPath") || "";
    let apiKey = localStorage.getItem("apiKey") || "";

    const baseUrlInput = document.getElementById("baseUrl");
    const apiPathInput = document.getElementById("apiPath");
    const apiKeyInput = document.getElementById("apiKey");

    baseUrlInput.value = baseUrl;
    apiPathInput.value = apiPath;
    apiKeyInput.value = apiKey;

    function saveConfig() {
      baseUrl = baseUrlInput.value.trim();
      apiPath = apiPathInput.value.trim();
      apiKey = apiKeyInput.value.trim();

      localStorage.setItem("baseUrl", baseUrl);
      localStorage.setItem("apiPath", apiPath);
      localStorage.setItem("apiKey", apiKey);
    }

    baseUrlInput.addEventListener("change", saveConfig);
    apiPathInput.addEventListener("change", saveConfig);
    apiKeyInput.addEventListener("change", saveConfig);

    function buildHeaders() {
      const headers = { "Content-Type": "application/json" };
      if (apiKey) headers["Authorization"] = `Bearer ${apiKey}`;
      return headers;
    }

    function getApiUrl() {
      if (!baseUrl || !apiPath) return null;
      return baseUrl.replace(/\/$/, "") + "/" + apiPath.replace(/^\//, "");
    }

    // ==============================

    const errorLog = [];
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      try {
        const apiUrl = getApiUrl();
        if (!apiUrl) throw new Error("API URL not configured");

        const res = await fetch(apiUrl, {
          method: "POST",
          headers: buildHeaders(),
          body: JSON.stringify({ message: text })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }

        const data = await res.json();
        addMessage(data.reply || "(No response)", "bot");
      } catch (err) {
        errorLog.push(err.message);
        addMessage("⚠️ " + err.message, "bot");
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
